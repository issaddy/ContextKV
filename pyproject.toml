[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextkv"
version = "0.1.0"
description = "Shared evidence encoding, structured document computation and native KV reuse"
readme = "README.md"
license-files = ["docs/third_party/APACHE-2.0.txt", "docs/third_party/*NOTICE.md", "bench/assets/loong/NOTICE.md"]
requires-python = ">=3.11"
dependencies = ["httpx", "PyYAML", "fastapi", "uvicorn"]

[project.optional-dependencies]
tokenizer = ["transformers", "tokenizers", "jinja2"]
retrieval = ["bm25s", "numpy"]
query-adapter = ["peft"]
evaluation = ["jinja2", "jsonschema", "psutil"]
external-reference = ["llama-index-core"]

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "ruff>=0.11,<1",
]

[project.scripts]
contextkv = "controller.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["controller*", "adapters*", "bench*", "engine_patches*", "training*"]

[tool.setuptools.package-data]
bench = ["assets/loong/*", "examples/*.json", "examples/*.jsonl", "examples/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
