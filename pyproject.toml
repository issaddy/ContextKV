[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextkv"
version = "0.1.0"
description = "Versioned evidence, cost-aware context planning and KV cache lifecycle research"
readme = "README.md"
license-files = ["docs/third_party/APACHE-2.0.txt", "docs/third_party/*NOTICE.md", "bench/assets/loong/NOTICE.md"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "PyYAML>=6,<7", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
tokenizer = ["transformers>=5.12,<6", "tokenizers>=0.22,<0.24", "jinja2>=3.1,<4"]
retrieval = ["bm25s>=0.3.15,<0.4", "numpy>=2.3,<3"]
query-adapter = ["peft>=0.21,<1"]
evaluation = ["jinja2>=3.1,<4", "prometheus-client>=0.21,<1", "jsonschema>=4,<5", "psutil>=7"]
external-reference = ["llama-index-core>=0.14.25,<0.15"]

[dependency-groups]
dev = [
    "jsonschema>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[project.scripts]
contextkv = "controller.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["controller*", "adapters*", "bench*", "profiling*", "engine_patches*", "training*"]

[tool.setuptools.package-data]
bench = ["assets/loong/*", "examples/*.json", "examples/*.jsonl", "examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
