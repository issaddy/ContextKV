study_config: configs/study.yaml
seed: 42
protocol: P3
resources:
  gpu_devices:
  - 4
  - 5
  - 6
  - 7
datasets:
  multidoc2dial:
    inputs:
      dev: data/multidoc2dial/dev/tasks.jsonl
      test: data/multidoc2dial/test/tasks.jsonl
    corpus_path: data/multidoc2dial/test/passages.jsonl
    dev_conversations: 32
    dev_seed: 42
    primary_metric: f1
    normalization: 1.0
    sparse_index: data/indexes/multidoc2dial/sparse
    dense_index: data/indexes/multidoc2dial/dense
  mtrag:
    inputs:
      test: data/mtrag/RAG.jsonl
    corpus_path: data/mtrag-official/cloud.jsonl
    corpus_id: mtrag
    domain: mt-rag-ibmcloud-elser-512-100-20240502
    primary_metric: mtrageval_harmonic
    normalization: 1.0
    max_passages: 10
    sparse_index: data/indexes/mtrag/sparse
    dense_index: data/indexes/mtrag/dense
methods:
- id: ordinary_rag
  overrides:
    execution:
      dialogue_mode: rag
- id: contextkv
  overrides:
    execution:
      dialogue_mode: contextkv
- id: llamaindex
  overrides:
    execution:
      dialogue_mode: llamaindex
