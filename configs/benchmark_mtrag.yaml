# Public MT-RAG: original RAG, the same A on native execution, and complete A/B/C.
# This separates retrieval/quality gains from execution/cache effects without a sweep.
# Current installed corpus/index assets cover Cloud (205 official tasks).
# The frozen split determines the actual run cohort; no outcome-based selection.
schema_version: 1
comparison_scope: system
base_config: configs/qwen3_8b_cost.yaml
input: data/mtrag/RAG.jsonl
domain: cloud
split_manifest: configs/mtrag_split_manifest.json
protocols: [P3]
concurrency: [1]
seeds: [42]
response_mode: buffered
reference_method: Native
retriever_config: configs/retriever_hybrid.example.yaml
evidence_corpus: data/mtrag-official/cloud.jsonl
server_profiles:
  stock:
    kind: stock
    checkout: vendor/sglang-stock
    write_policy: write_through
    hicache: true
    session_radix: true
    gpu_tokens: 16384
    hicache_gb: 8
    mem_fraction_static: 0.8
  patched:
    kind: patched
    checkout: vendor/sglang
    write_policy: write_through
    hicache: true
    session_radix: true
    gpu_tokens: 16384
    hicache_gb: 8
    mem_fraction_static: 0.8
methods:
  - id: Native
    kind: native
    server_profile: stock
    native:
      baseline: B1
      base_url: http://127.0.0.1:30000
      local_files_only: true
      audit_prompt_ids: true
  - id: ContextKV
    server_profile: patched
    retriever_config: configs/retriever_conversational.example.yaml
  - id: NativeWithA
    kind: native
    server_profile: stock
    retriever_config: configs/retriever_conversational.example.yaml
    native:
      baseline: B1
      base_url: http://127.0.0.1:30000
      local_files_only: true
      audit_prompt_ids: true
