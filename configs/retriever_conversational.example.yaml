# Task-aware retrieval: Qwen3-8B generation, Qwen3-32B interpretation on port 30001.
# First turns and literal task composition skip interpretation; other turns update task state.
# Bind --evidence-corpus to use source context in the same reranking pass.
# Original questions/history remain intact.
# Optional context.layout=contextpilot separates cached body order and relevance.
# The measured deployment uses generation GPU0 and interpretation/retrieval GPU1.
# Keep stable_key for the integrated path; ContextPilot is a separate layout choice.
schema_version: 1
kind: hybrid
stage: hybrid_rerank
query_mode: conversational
sparse_index: data/cloud-bm25s
dense_index: data/cloud-bge-m3
encoder_path: models/bge-m3
reranker_path: models/bge-reranker-v2-m3
device: cuda:1
dtype: bfloat16
batch_size: 16
encoder_max_length: 8192
reranker_max_length: 1024
candidate_k: 50
rerank_k: 50
rrf_k: 60
cpu_threads: 1
query_fusion: single
# Neighboring passages may cross procedures (for example pinned vs latest release).
# Keep expansion explicit until it preserves task applicability and fits cost support.
source_window: false

# Omit selector only when intentionally using the model-free history fallback.
selector:
  base_url: http://127.0.0.1:30001
  model: /media/ssd1/qwen3-32b
  revision: local-snapshot:7442623e99dd0b456628ddc48805a4ea11249ee2ee66484b5d1ab44d2940beb8
  tokenizer_path: /media/ssd1/qwen3-32b
  max_input_tokens: 8192
  max_new_tokens: 192
  context_window: 32768
  timeout_seconds: 60
  temperature: 0
