study:
  output_dir: runs/current
generation:
  run_config: configs/qwen3_32b.yaml
  teacher_url: http://127.0.0.1:30000
scoring:
  python: python3
  gpu_devices: [5]
  official_checkout: data/mtrag-official
  max_tokens: 2048
  ragas_json_schema: true
retrieval:
  corpus_path: data/multidoc2dial/test/passages.jsonl
  corpus_id: multidoc2dial
  sparse_index: data/indexes/multidoc2dial/sparse
  dense_index: data/indexes/multidoc2dial/dense
  candidate_k: 50
  evidence_batch: 24
selection:
  body_tokens: 16384
execution:
  dialogue_mode: contextkv
  cache_start: cold
  window_tokens: 32768
  history_tokens: 8192
  output_tokens: 1024
  max_total_tokens: 131072
shared:
  query:
    model_path: models/qwen3-embedding-0.6b
    asset_path: models/shared-query
    device: cuda:2
  evidence:
    model_path: models/jina-reranker-v3.5
    asset_path: models/shared-evidence
    device: cuda:3
    batch_tokens: 16384
  runtime:
    stop_asset: models/shared-stop.pt
    kv_quality_asset: models/infoflow-quality.json
    kv_mode: auto
    recompute_ratio: 0.15
    prices:
      seconds: 0.001
      tail_seconds: 0.001
      gpu_gib_seconds: 0.0
      host_gib_seconds: 0.0
