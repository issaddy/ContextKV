# Cross-document public-service conversations through the existing P3 system runner.
# Shared BM25 over all 488 documents provides an execution comparison without an
# extra model/index dependency. Task-aware hybrid retrieval can use the same corpus.
schema_version: 1
comparison_scope: execution
base_config: configs/qwen3_8b_cost.yaml
input: data/multidoc2dial/test/tasks.jsonl
domain: all
split_manifest: data/multidoc2dial/test/split_manifest.json
protocols: [P3]
concurrency: [1]
seeds: [42]
response_mode: buffered
reference_method: Native
retriever_index: data/multidoc2dial/bm25
evidence_corpus: data/multidoc2dial/test/corpus.jsonl
server_profiles:
  stock:
    kind: stock
    checkout: vendor/sglang-stock
    write_policy: write_through
    hicache: true
    session_radix: true
    gpu_tokens: 16384
    hicache_gb: 8
    mem_fraction_static: 0.8
  patched:
    kind: patched
    checkout: vendor/sglang
    write_policy: write_through
    hicache: true
    session_radix: true
    gpu_tokens: 16384
    hicache_gb: 8
    mem_fraction_static: 0.8
methods:
  - id: Native
    kind: native
    server_profile: stock
    native:
      baseline: B1
      base_url: http://127.0.0.1:30000
      local_files_only: true
      audit_prompt_ids: true
  - id: ContextKV
    server_profile: patched
