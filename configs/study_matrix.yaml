study_config: configs/study.yaml
seed: 42
protocol: P1
resources:
  gpu_devices:
  - 4
  - 5
  - 6
  - 7
datasets:
  multidoc2dial:
    inputs:
      dev: data/multidoc2dial/dev/tasks.jsonl
      test: data/multidoc2dial/test/tasks.jsonl
    corpus_path: data/multidoc2dial/test/passages.jsonl
    dev_conversations: 32
    dev_seed: 42
    primary_metric: f1
    normalization: 1.0
    sparse_index: data/indexes/multidoc2dial/sparse
    dense_index: data/indexes/multidoc2dial/dense
  mtrag:
    inputs:
      test: data/mtrag/RAG.jsonl
    corpus_path: data/mtrag-official/cloud.jsonl
    corpus_id: mtrag
    domain: mt-rag-ibmcloud-elser-512-100-20240502
    primary_metric: mtrageval_harmonic
    normalization: 1.0
    max_passages: 10
    sparse_index: data/indexes/mtrag/sparse
    dense_index: data/indexes/mtrag/dense
  mtrag_clapnq:
    evaluation_only: true
    inputs:
      test: data/mtrag/RAG.jsonl
    corpus_path: data/mtrag-official/clapnq.jsonl
    corpus_id: mtrag_clapnq
    domain: mt-rag-clapnq-elser-512-100-20240503
    primary_metric: mtrageval_harmonic
    normalization: 1.0
    max_passages: 10
    sparse_index: data/indexes/mtrag_clapnq/sparse
    dense_index: data/indexes/mtrag_clapnq/dense
  mtrag_govt:
    evaluation_only: true
    inputs:
      test: data/mtrag/RAG.jsonl
    corpus_path: data/mtrag-official/govt.jsonl
    corpus_id: mtrag_govt
    domain: mt-rag-govt-elser-512-100-20240611
    primary_metric: mtrageval_harmonic
    normalization: 1.0
    max_passages: 10
    sparse_index: data/indexes/mtrag_govt/sparse
    dense_index: data/indexes/mtrag_govt/dense
  mtrag_fiqa:
    evaluation_only: true
    inputs:
      test: data/mtrag/RAG.jsonl
    corpus_path: data/mtrag-official/fiqa.jsonl
    corpus_id: mtrag_fiqa
    domain: mt-rag-fiqa-beir-elser-512-100-20240501
    primary_metric: mtrageval_harmonic
    normalization: 1.0
    max_passages: 10
    sparse_index: data/indexes/mtrag_fiqa/sparse
    dense_index: data/indexes/mtrag_fiqa/dense
  versionqa:
    inputs:
      test: data/evaluation/versionqa/references.jsonl
    corpus_path: data/evaluation/versionqa/corpus.jsonl
    corpus_id: versionqa
    primary_metric: versionqa_accuracy
    normalization: 1.0
    sparse_index: data/indexes/versionqa/sparse
    dense_index: data/indexes/versionqa/dense
  loong:
    inputs:
      test: data/loong/set1-v2/tasks.jsonl
    supplied_documents: true
    coverage_mode: selected_sources
    primary_metric: loong_reference_score
    normalization: 100.0
    corpus_id: loong
methods:
- id: ordinary_rag
  overrides:
    execution:
      dialogue_mode: rag
- id: contextkv
  overrides:
    execution:
      dialogue_mode: contextkv
- id: llamaindex
  overrides:
    execution:
      dialogue_mode: llamaindex
