schema_version: 1
study_config: configs/study.yaml
baseline_commit: 85f4ed4
seed: 42
protocol: P3
selection:
  baseline: B0
  development_weights: {multidoc2dial: 0.30, mtrag: 0.25, versionqa: 0.20, loong: 0.25}
  near_equal_quality: 0.002
  equal_cost_relative_tolerance: 0.05
  bootstrap_samples: 5000
  objective: continuous_quality
  test_comparators: [B0, Btoken, B3, B6, Lmap]
# capacity_workflow materializes these recipes against the frozen A and declared IDs.
final_evaluation:
  protocol: P3
  declared_qa: 350
  declared_sessions: 77
  concurrency: [1, 4]
  baseline: RAG_native
  main_methods: [RAG_native, context_cache_demand, LlamaIndex_native]
  acceptance:
    candidate: context_cache_demand
    quality_improvement: 0.05
    quality_noninferiority: 0.002
    p95_ratio: 0.85
  main_comparisons:
    ordinary_qa: {reference: RAG_native, method: context_cache_demand, scope: whole_system}
    external_method: {reference: LlamaIndex_native, method: context_cache_demand, scope: whole_system}
  # Select only the pair needed to answer the current mechanism question.
  optional_ablations:
    prefix_order: {reference: context_native, method: context_cache_order, factor: compilation}
    demand_retention: {reference: context_cache_order, method: context_cache_demand, factor: retention}
    action_decision: {reference: Rule_contextpilot_joint_demand, method: context_cache_demand, factor: B}
    fact_reuse: {reference: context_no_fact_reuse, method: context_cache_demand, factor: fact_reuse}
  # Earlier decomposition of fixed/gain B and compilation with existing representations.
  factorial:
    E1: {method: B6_native, B: fixed, compilation: native, retention: native}
    E2: {method: S3_native, B: gain, compilation: native, retention: native}
    E3: {method: B6_contextpilot, B: fixed, compilation: contextpilot, retention: native}
    E4: {method: S3_contextpilot, B: gain, compilation: contextpilot, retention: native}
  historical_labels:
    S3_contextpilot_joint_native: context_cache_order
    S3_contextpilot_joint_demand: context_cache_demand
  external_reference:
    method: LlamaIndex_native
    dialogue_mode: llamaindex
    retrieval: hybrid_rerank
    compilation: native
    retention: native
  historical_fact_reuse_control:
    method: S3_contextpilot_no_fact_reuse
    reference: S3_contextpilot
    overrides: {reading: {fact_reuse: false}}
  cache_cooperation:
    context_native: {compilation: native, retention: native}
    context_cache_order: {compilation: contextpilot, retention: native}
    context_cache_demand: {compilation: contextpilot, retention: demand}
  arrival_plan: configs/study_dev_arrivals.json
  cost_scope: all_online_and_physical_costs
resources:
  gpu_capacity_tokens: 32768
  host_capacity_tokens: 61056
  gpu_devices: [0, 1]
  p95_complete_ms: 120000
  max_online_tokens: 200000000
  concurrency: [1, 4]
datasets:
  multidoc2dial:
    inputs:
      dev: data/multidoc2dial/dev/tasks.jsonl
      test: data/multidoc2dial/test/tasks.jsonl
    corpus_path: data/multidoc2dial/test/passages.jsonl
    retriever_config: configs/study_multidoc_retriever.yaml
    split_kind: native
    dev_conversations: 32
    dev_seed: 42
    primary_metric: RB_llm
    normalization: 1.0
    weight: 0.25
  mtrag:
    input: data/mtrag/RAG.jsonl
    split_manifest: data/mtrag/split_manifest.json
    corpus_path: data/mtrag-official/cloud.jsonl
    corpus_id: mtrag
    retriever_config: configs/retriever_dialogue.example.yaml
    domain: mt-rag-ibmcloud-elser-512-100-20240502
    split_kind: project_conversation
    primary_metric: mtrageval_harmonic
    normalization: 1.0
    max_passages: 10
    weight: 0.2
  mtrag_un:
    input: data/mtrag-un/reference.jsonl
    split_manifest: data/mtrag-un/split_manifest.json
    protocol: P1
    supplied_documents: true
    evaluation_only: true
    split_kind: project_selected_turn_reference_diagnostic
    primary_metric: mtrageval_harmonic
    normalization: 1.0
    max_passages: 10
    weight: 0.15
  versionqa:
    inputs:
      dev: runs/study/evaluation/version_dev/tasks.jsonl
      test: runs/study/evaluation/versionqa/references.jsonl
    split_kind: independent_family_dev_and_public_test
    retrieval_by_split:
      test:
        corpus_path: runs/study/evaluation/versionqa/corpus.jsonl
        corpus_id: versionqa
        config_path: configs/study_versionqa_retriever.yaml
    primary_metric: project_condition_version_score
    scoring:
      project_weights: {correctness: 0.5, conditions_versions: 0.5}
    normalization: 1.0
    weight: 0.15
  loong:
    inputs:
      dev: runs/study/evaluation/long_dev/tasks.jsonl
      test: data/loong/set1-v2/tasks.jsonl
    split_kind: independent_training_sources_dev_and_public_test
    coverage_mode: all_supplied_documents
    primary_metric: loong_reference_score
    normalization: 100.0
    metric_by_split:
      dev:
        primary_metric: project_condition_version_score
        normalization: 1.0
        scoring:
          project_weights: {correctness: 1.0}
          project_track: constructed_long_dev_correctness
          project_reference_only: true
    weight: 0.25
methods:
  - {id: B0, strategy: B0, description: Dense5_REBUILD}
  - {id: Btoken, strategy: Btoken, description: relevance_token_budget}
  - id: B3
    strategy: B3
    description: single_pair_triple_search
    overrides: {selection: {mode: support}}
  - {id: B6, strategy: B6, description: coverage_READ_REDUCE_multihop}
  - {id: B7, strategy: B7, description: native_KV_complete_cost_no_new_training}
  - {id: Lmap, strategy: Lmap, description: full_scope_map_reduce}
