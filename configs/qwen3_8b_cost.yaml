# Tested Qwen3-8B / H200 / 16K GPU + 54272 Host tokens.
# Start the matching engine with CONTEXTKV_SAMPLE_POOL=1; see docs/deployment.md.
engine:
  kind: sglang
  base_url: http://127.0.0.1:30000
  timeout_seconds: 180
  stream: true
  gpu_capacity_tokens: 16384
  host_capacity_tokens: 54272
  page_size: 64
model:
  scope_path: configs/model_scopes/qwen3-8b.local.json
context:
  max_total_model_tokens: 32768
  max_new_tokens: 1024
planner:
  strategy: cost
cost_model:
  artifact: configs/calibration/qwen3-8b-h200.json
  admission_estimator: native_budget
shadow: false
state_dir: runs/contextkv-service
sampling:
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  min_p: 0
