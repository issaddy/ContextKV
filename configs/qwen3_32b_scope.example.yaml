# Same-container fixed-policy scope smoke. No Qwen3 timing/quality calibration.
# Uses explicit head_dim128 from the inspected config, never hidden_size/heads.
engine:
  kind: sglang
  base_url: http://127.0.0.1:30000
  page_size: 64
model:
  scope_path: configs/model_scopes/qwen3-32b.local.json
context:
  max_total_model_tokens: 32768
  max_new_tokens: 1024
planner:
  strategy: always_rebuild
shadow: false
state_dir: runs/qwen3-32b-scope
