reader_training:
  base_scope: configs/model_scopes/qwen3-32b.local.json
  r0_run_config: configs/qwen3_32b.yaml
  output_dir: models/study-reader
  merged_model_dir: models/study-reader-merged
  r1_base_url: http://127.0.0.1:30004
  seed: 42
  resource_sample_seconds: 0.5
  max_length: 16384
  attention_implementation: sdpa
  batch_size: 1
  gradient_accumulation_steps: 8
  epochs: 1
  max_steps: -1
  logging_steps: 1
  evaluate_train_holdout: true
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  optimizer:
    learning_rate: 0.00002
    weight_decay: 0.01
    warmup_ratio: 0.03
    max_grad_norm: 1.0
  data:
    output_dir: runs/study/reader-data
    minimum_train_turns: 200
    export_turns: null
    answer_output_tokens: 1024
    minimum_quality: 0.85
    read_protocol_versions: [2, 3, 4]
    require_independent_review: true
    validation_fraction: 0.03
    split_seed: 42
    rollouts: []
  review:
    base_urls: [http://127.0.0.1:30001]
    gpu_devices: [2]
    context_window: 32768
    max_input_tokens: 26624
    max_output_tokens: 6144
    timeout_seconds: 600
