# Optional selected-turn diagnostic with original author history and supplied contexts.
schema_version: 1
study_config: configs/study.yaml
seed: 42
protocol: P1
selection:
  baseline: RAG_native
  near_equal_quality: 0.002
final_evaluation:
  baseline: RAG_native
  main_methods:
  - RAG_native
  - context_cache_demand
  - LlamaIndex_native
  acceptance:
    candidate: context_cache_demand
    quality_improvement: 0.05
    quality_noninferiority: 0.002
    p95_ratio: 0.85
resources:
  gpu_capacity_tokens: 32768
  host_capacity_tokens: 61056
  gpu_devices:
  - 0
  - 1
  p95_complete_ms: 120000
  max_online_tokens: 200000000
  concurrency:
  - 1
  - 4
datasets:
  mtrag_un:
    input: data/mtrag-un/reference.jsonl
    split_manifest: data/mtrag-un/split_manifest.json
    supplied_documents: true
    split_kind: project_selected_turn_reference_diagnostic
    primary_metric: mtrageval_harmonic
    normalization: 1.0
    max_passages: 10
