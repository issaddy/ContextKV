name: CPU correctness
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make install
      - run: python3 -m pip install pytest pytest-asyncio ruff
      - run: make test lint demo
