name: CPU correctness
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra retrieval --extra evaluation --extra tokenizer --locked
      - run: uv run --extra retrieval --extra evaluation --extra tokenizer pytest -q
      - run: uv run ruff check controller adapters bench profiling tests scripts engine_patches
      - run: uv run python -m bench.run_sessions --config configs/demo.yaml demo
