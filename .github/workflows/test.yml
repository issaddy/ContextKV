name: CPU correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra retrieval --extra calibration --extra evaluation --locked
      - run: uv run --extra retrieval --extra calibration --extra evaluation pytest -q
      - run: uv run ruff check controller adapters bench profiling tests scripts engine_patches
      - run: uv run contextkv --config configs/demo.yaml demo
